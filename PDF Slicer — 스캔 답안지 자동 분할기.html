<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF Slicer — 스캔 답안지 자동 분할기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EEF1F5; --panel:#FFFFFF; --side:#1F2A3A; --side-2:#2B3850; --side-line:#3A4A66;
  --ink:#172033; --muted:#6B7689; --line:#D9DEE6; --accent:#2457D6; --accent-ink:#fff;
  --ok:#1E9E6A; --warn:#C47A12; --bad:#D24343; --paper-shadow:rgba(23,32,51,.18);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  color-scheme:dark; --bg:#0F1419; --panel:#161C25; --side:#0B1017; --side-2:#1A2230; --side-line:#26303F;
  --ink:#E7ECF3; --muted:#8C98AB; --line:#2A3443; --paper-shadow:rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#0F1419; --panel:#161C25; --side:#0B1017; --side-2:#1A2230; --side-line:#26303F;
  --ink:#E7ECF3; --muted:#8C98AB; --line:#2A3443; --paper-shadow:rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;min-height:100%}

/* ── sidebar ── */
.side{width:380px;flex:none;background:var(--side);color:#E8EDF5;padding:28px 26px 32px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--side-line)}
.brand .mark{width:40px;height:40px;border-radius:10px;background:var(--accent);display:grid;place-items:center;font-size:20px}
.brand h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:12px;color:#9AA7BC}
.field label{display:block;font-size:12px;font-weight:500;color:#9AA7BC;margin-bottom:6px}
.field .hint{font-size:11.5px;color:#7F8CA2;margin-top:5px;line-height:1.45}
.row{display:flex;gap:6px}
.row>*{min-width:0}
input[type=text],input[type=number]{width:100%;height:38px;padding:0 11px;border-radius:8px;border:1px solid var(--side-line);background:var(--side-2);color:#E8EDF5;font:inherit;outline:none}
input:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,87,214,.35)}
input::placeholder{color:#6F7C92}
.btn{height:38px;padding:0 14px;border-radius:8px;border:0;background:var(--side-2);color:#E8EDF5;font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:#3A4A66}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#1C47B4}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.fname{background:var(--side-2);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.fname .lab{font-size:11px;color:#9AA7BC;margin-bottom:4px}
.fname .fixed{height:38px;display:grid;place-items:center;font-weight:600;color:#7F8CA2;padding:0 2px}
.preview-name{font-size:12px;color:#7FA6FF;margin-top:6px}
.run{margin-top:auto;padding-top:18px;border-top:1px solid var(--side-line);display:flex;flex-direction:column;gap:10px}
.btn.run-btn{height:48px;font-size:15px;font-weight:600}
.status{font-size:12.5px;color:#9AA7BC;min-height:18px;white-space:pre-line}
.status.ok{color:#5FD3A3}.status.bad{color:#FF7B7B}.status.warn{color:#F3B35C}

/* ── main ── */
.main{flex:1;min-width:0;padding:20px;display:flex;flex-direction:column;gap:16px}
.paper{flex:1;min-height:320px;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.canvas-wrap{flex:1;display:grid;place-items:center;padding:20px;background:var(--bg);overflow:auto;position:relative}
canvas{max-width:100%;max-height:100%;box-shadow:0 8px 28px var(--paper-shadow);background:#fff;border-radius:2px}
.placeholder{color:var(--muted);text-align:center;font-size:14px}
.placeholder .icon{font-size:44px;opacity:.5;margin-bottom:8px}
.drop{outline:2px dashed var(--accent);outline-offset:-10px}
.nav{display:flex;gap:8px;align-items:center;justify-content:center;padding:12px;border-top:1px solid var(--line)}
.nav .btn{background:var(--bg);color:var(--ink);width:44px;padding:0}
.nav .btn:hover{background:var(--line)}
.nav .pg{min-width:110px;text-align:center;font-weight:600;color:var(--muted)}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;max-height:34vh;overflow:auto}
.plan h2{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--muted)}
.plan table{width:100%;border-collapse:collapse;font-size:13px}
.plan td{padding:4px 6px;border-bottom:1px solid var(--line)}
.plan td:first-child{font-weight:600;width:120px}
.plan td.w{color:var(--warn)}
.plan .note{font-size:12.5px;color:var(--warn);margin-top:8px}
.plan .note.ok{color:var(--ok)}
.plan .note.bad{color:var(--bad)}
input[type=file]{display:none}

@media (max-width:860px){
  body{flex-direction:column}
  .side{width:100%;padding:20px 18px}
  .run{margin-top:4px}
  .main{padding:14px}
  .paper{min-height:420px}
}
@media (prefers-reduced-motion:no-preference){ .btn{transition:background .15s} }
</style>
</head>
<body>

<aside class="side">
  <div class="brand">
    <div class="mark">✂</div>
    <div><h1>PDF Slicer</h1><p>스캔 답안지 자동 분할기</p></div>
  </div>

  <div class="field">
    <label for="fileBtn">① 원본 PDF</label>
    <div class="row">
      <input type="text" id="fileName" placeholder="파일을 선택하거나 오른쪽에 끌어다 놓으세요" readonly>
      <button class="btn primary" id="fileBtn" type="button">찾기</button>
      <input type="file" id="fileInput" accept="application/pdf">
    </div>
  </div>

  <div class="field">
    <label>② 파일명 설정</label>
    <div class="fname">
      <div><div class="lab">학년반</div><input type="text" id="prefix" placeholder="예) 109" inputmode="numeric"></div>
      <div><div class="lab">번호</div><div class="fixed">01</div></div>
      <div><div class="lab">접미어(선택)</div><input type="text" id="suffix" placeholder="_수학"></div>
    </div>
    <div class="preview-name" id="fnamePreview">예: 10901_수학.pdf</div>
  </div>

  <div class="field">
    <label for="interval">③ 학생 1명당 페이지 수</label>
    <div class="row" style="align-items:center">
      <input type="number" id="interval" value="2" min="1" style="width:90px;flex:none">
      <span style="color:#9AA7BC">쪽 (기본값)</span>
    </div>
  </div>

  <div class="field">
    <label for="skip">④ 결번(건너뛸 번호)</label>
    <input type="text" id="skip" placeholder="예) 3, 7, 15">
    <div class="hint">결석 등으로 빠진 번호. 해당 번호는 건너뛰고 다음 번호로 이어서 생성됩니다.</div>
  </div>

  <div class="field">
    <label for="exceptions">⑤ 페이지 수 예외</label>
    <input type="text" id="exceptions" placeholder="예) 5:4, 12:6">
    <div class="hint">번호:페이지수 형식. 특정 학생만 페이지가 더 많을 때(예: 5번 학생 4쪽) 지정하세요.</div>
  </div>

  <div class="run">
    <button class="btn primary run-btn" id="runBtn" type="button" disabled>일괄 분할 → ZIP 저장</button>
    <div class="status" id="status"></div>
  </div>
</aside>

<main class="main">
  <section class="paper">
    <div class="canvas-wrap" id="canvasWrap">
      <div class="placeholder" id="placeholder"><div class="icon">📄</div>PDF 파일을 선택하면<br>미리보기가 표시됩니다.</div>
      <canvas id="canvas" hidden></canvas>
    </div>
    <div class="nav">
      <button class="btn" id="prevBtn" type="button" aria-label="이전 페이지">◀</button>
      <div class="pg" id="pageLabel">— / —</div>
      <button class="btn" id="nextBtn" type="button" aria-label="다음 페이지">▶</button>
    </div>
  </section>
  <section class="plan" id="plan" hidden>
    <h2>분할 계획</h2>
    <table><tbody id="planBody"></tbody></table>
    <div class="note" id="planNote"></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $ = id => document.getElementById(id);
const state = { bytes:null, name:"", pdf:null, page:0, total:0, rendering:false, pending:false };

// ── 파일 선택 / 드롭 ──
$("fileBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); };
const wrap = $("canvasWrap");
wrap.ondragover = e => { e.preventDefault(); wrap.classList.add("drop"); };
wrap.ondragleave = () => wrap.classList.remove("drop");
wrap.ondrop = e => { e.preventDefault(); wrap.classList.remove("drop");
  const f = e.dataTransfer.files[0]; if (f && f.type === "application/pdf") loadFile(f); };

async function loadFile(file){
  setStatus("불러오는 중…");
  try{
    state.bytes = new Uint8Array(await file.arrayBuffer());
    state.name = file.name;
    state.pdf = await pdfjsLib.getDocument({ data: state.bytes.slice(0) }).promise;
    state.total = state.pdf.numPages; state.page = 0;
    $("fileName").value = file.name;
    $("placeholder").hidden = true; $("canvas").hidden = false;
    $("runBtn").disabled = false;
    setStatus(`${state.total}쪽 불러옴`);
    renderPage(); updatePlan();
  }catch(err){ setStatus("PDF를 열 수 없습니다: " + err.message, "bad"); }
}

// ── 미리보기 ──
async function renderPage(){
  if (!state.pdf) return;
  if (state.rendering){ state.pending = true; return; }
  state.rendering = true;
  try{
    const page = await state.pdf.getPage(state.page + 1);
    const vp1 = page.getViewport({ scale:1 });
    const availW = wrap.clientWidth - 40, availH = wrap.clientHeight - 40;
    const fit = Math.min(availW / vp1.width, availH / vp1.height, 2);
    const dpr = window.devicePixelRatio || 1;
    const vp = page.getViewport({ scale: fit * dpr });
    const c = $("canvas"); c.width = vp.width; c.height = vp.height;
    c.style.width = (vp.width/dpr) + "px"; c.style.height = (vp.height/dpr) + "px";
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    $("pageLabel").textContent = `${state.page+1}  /  ${state.total}`;
  } finally {
    state.rendering = false;
    if (state.pending){ state.pending = false; renderPage(); }
  }
}
$("prevBtn").onclick = () => { if (state.page > 0){ state.page--; renderPage(); } };
$("nextBtn").onclick = () => { if (state.page < state.total-1){ state.page++; renderPage(); } };
wrap.addEventListener("wheel", e => { if (!state.pdf) return; e.preventDefault();
  e.deltaY < 0 ? $("prevBtn").click() : $("nextBtn").click(); }, { passive:false });
let resizeT; window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(renderPage, 150); });

// ── 입력 파싱 ──
function parseSkip(t){
  const s = new Set();
  for (let tok of t.split(",")){ tok = tok.trim(); if (!tok) continue;
    if (!/^\d+$/.test(tok)) throw new Error(`결번 '${tok}'은(는) 올바른 번호가 아닙니다.`);
    s.add(+tok); }
  return s;
}
function parseExceptions(t){
  const m = new Map();
  for (let tok of t.split(",")){ tok = tok.trim(); if (!tok) continue;
    const mm = tok.match(/^(\d+)\s*:\s*(\d+)$/);
    if (!mm || +mm[2] < 1) throw new Error(`페이지 수 예외 '${tok}' 형식이 올바르지 않습니다. (예: 5:4)`);
    m.set(+mm[1], +mm[2]); }
  return m;
}
function readSettings(){
  const prefix = $("prefix").value.trim(), suffix = $("suffix").value.trim();
  const interval = parseInt($("interval").value, 10);
  if (!(interval >= 1)) throw new Error("학생 1명당 페이지 수를 1 이상의 숫자로 입력하세요.");
  const skip = parseSkip($("skip").value), exc = parseExceptions($("exceptions").value);
  const overlap = [...skip].filter(n => exc.has(n));
  if (overlap.length) throw new Error(`번호 ${overlap.join(", ")}은(는) 결번과 페이지 수 예외에 동시에 지정될 수 없습니다.`);
  return { prefix, suffix, interval, skip, exc };
}

// 페이지 → 학생 배정 계획
function buildPlan(total, { prefix, suffix, interval, skip, exc }){
  const items = [], warnings = []; let num = 1, idx = 0;
  while (idx < total){
    if (skip.has(num)){ num++; continue; }
    const want = exc.get(num) ?? interval;
    let end = idx + want - 1;
    if (end > total - 1){ warnings.push(`${num}번: ${want}쪽 지정했지만 ${total-idx}쪽만 남아 있어 남은 페이지까지만 저장됩니다.`); end = total - 1; }
    items.push({ num, from: idx, to: end, name: `${prefix}${String(num).padStart(2,"0")}${suffix}.pdf` });
    idx = end + 1; num++;
  }
  return { items, warnings };
}

// ── 계획 표시 ──
function updatePlan(){
  const plan = $("plan"), body = $("planBody"), note = $("planNote");
  if (!state.pdf){ plan.hidden = true; return; }
  plan.hidden = false; body.innerHTML = "";
  try{
    const s = readSettings();
    const { items, warnings } = buildPlan(state.total, s);
    for (const it of items){
      const tr = document.createElement("tr");
      const td1 = document.createElement("td"); td1.textContent = it.name;
      const td2 = document.createElement("td"); td2.textContent = `${it.from+1}–${it.to+1}쪽 (${it.to-it.from+1}쪽)`;
      if (warnings.length && it === items[items.length-1]) td2.className = "w";
      tr.append(td1, td2); body.appendChild(tr);
    }
    note.className = "note " + (warnings.length ? "" : "ok");
    note.textContent = warnings.length ? "⚠ " + warnings.join("\n") : `✓ 총 ${state.total}쪽 → ${items.length}명, 딱 맞게 나누어집니다.`;
  }catch(err){ note.className = "note bad"; note.textContent = err.message; }
}
function updateFname(){
  const p = $("prefix").value.trim() || "101", s = $("suffix").value.trim();
  $("fnamePreview").textContent = `예: ${p}01${s}.pdf`;
}
for (const id of ["prefix","suffix","interval","skip","exceptions"])
  $(id).addEventListener("input", () => { updateFname(); updatePlan(); });

// ── 분할 실행 ──
let downloads = null;
if (window.claude?.use) claude.use("downloads").then(d => { downloads = d; });

$("runBtn").onclick = async () => {
  let s;
  try{ s = readSettings(); }catch(err){ setStatus(err.message, "bad"); return; }
  if (!s.prefix){ setStatus("학년/반 앞자리를 입력하세요. (예: 109)", "bad"); $("prefix").focus(); return; }
  const { items, warnings } = buildPlan(state.total, s);
  const btn = $("runBtn"); btn.disabled = true; btn.textContent = "처리 중…";
  try{
    const src = await PDFLib.PDFDocument.load(state.bytes);
    const zip = new JSZip();
    for (let i = 0; i < items.length; i++){
      const it = items[i];
      const out = await PDFLib.PDFDocument.create();
      const range = Array.from({ length: it.to - it.from + 1 }, (_, k) => it.from + k);
      const pages = await out.copyPages(src, range);
      pages.forEach(p => out.addPage(p));
      zip.file(it.name, await out.save());
      setStatus(`진행: ${i+1} / ${items.length}명 (${it.to+1} / ${state.total}쪽)`);
    }
    const blob = await zip.generateAsync({ type:"blob" });
    const zipName = `${s.prefix}${s.suffix || ""}_분할.zip`;
    await deliver(zipName, blob);
    setStatus(`✓ ${items.length}명 파일 완성 → ${zipName}` + (warnings.length ? "\n⚠ " + warnings.join("\n") : ""), warnings.length ? "warn" : "ok");
  }catch(err){
    setStatus(err.code === "declined" ? "저장을 취소했습니다." : "오류: " + (err.message || err), "bad");
  }finally{ btn.disabled = false; btn.textContent = "일괄 분할 → ZIP 저장"; }
};

async function deliver(filename, blob){
  if (downloads){ await downloads.save({ filename, data: blob }); return; }
  // 로컬 파일로 열었을 때의 일반 다운로드
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function setStatus(msg, kind=""){ const el = $("status"); el.textContent = msg; el.className = "status " + kind; }
</script>
</body>
</html>
